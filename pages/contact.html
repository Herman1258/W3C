<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W3C Store - Contact Us</title>
    <link rel="stylesheet" href="../css/contact.css">
</head>
<body>

    <!-- RESPONSIVE BONUS HEADER -->
    <header class="responsive-layout header-container">
        <div class="logo">LOGO</div>
        <nav class="nav-links">
            <a href="../index.html">Home</a>
            <a href="products.html">Products</a>
        </nav>
    </header>

    <!-- MAIN CONTACT FORMS INTERFACE -->
    <main class="responsive-layout contact-main">
        <section class="contact-info">
            <h2>Get In Touch</h2>
            <p>Have questions about your order or our tech inventory products? Reach out via our responsive form interface.</p>
        </section>

        <section class="contact-form-box">
            <form>
                <div class="form-group">
                    <label>Your Full Name</label>
                    <input type="text" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label>Message Content</label>
                    <textarea rows="4" placeholder="How can we assist you?" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </section>
    </main>

    <!-- RESPONSIVE BONUS FOOTER -->
    <footer class="responsive-layout footer-container">
        <div class="footer-column">
            <h4>Social Media</h4>
            <a href="#">Facebook</a>
            <a href="#">Instagram</a>
        </div>
        <div class="footer-column">
            <h4>Contact Actions</h4>
            <button onclick="location.href='mailto:info@example.com'">Email Us</button>
            <button onclick="location.href='tel:+1234567890'">Call Us</button>
        </div>
        <div class="footer-column">
            <h4>Information</h4>
            <button>Privacy Policy</button>
            <button>Newsletter</button>
        </div>
    </footer>

</body>
</html>
